<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>✅ Basic HTML and CSS Quiz</h1>
        <form action="">
            <div class="quiz-itme">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-itme">
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-itme">
                <label for="q3">3. Which of the following is a vaild CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled></option>
                    <option value="a">A. &lt;!-- this is a comment --&lt;</option>
                    <option value="b">B. /* This is a comment */</option>
                    <option value="c">C. // This is a comment</option>
                </select>
            </div>
            <div class="quiz-itme">
                <label for="q4">4. What is the bottom maergin given this decleration?</label>
                <input type="text" id="q4" name="q4">
            </div>
        </form>
    </main>
</body>
